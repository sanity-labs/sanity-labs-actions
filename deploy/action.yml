name: Deploy
description: Update kustomization image tag and push to trigger ArgoCD sync

inputs:
  image-tag:
    description: The new image tag (typically github.sha)
    required: true
  overlay-path:
    description: Path to the kustomize overlay directory
    required: false
    default: deploy/overlays/labs

runs:
  using: composite
  steps:
    - name: Update image tag
      shell: bash
      run: |
        KUSTOMIZATION="${{ inputs.overlay-path }}/kustomization.yaml"
        if [ ! -f "$KUSTOMIZATION" ]; then
          echo "::error::$KUSTOMIZATION not found"
          exit 1
        fi
        sed -i "s/newTag:.*/newTag: ${{ inputs.image-tag }}/" "$KUSTOMIZATION"

    - name: Commit and push
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "${{ inputs.overlay-path }}/kustomization.yaml"
        if ! git diff --staged --quiet; then
          git commit -m "deploy: update image to ${{ inputs.image-tag }}"
          git push
        else
          echo "No changes to commit — tag already up to date"
        fi
