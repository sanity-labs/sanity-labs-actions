name: Setup GCP
description: Authenticate to GCP and configure Docker for Artifact Registry

runs:
  using: composite
  steps:
    - name: Authenticate to GCP
      id: wif
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/670405469856/locations/global/workloadIdentityPools/github-actions/providers/github
        service_account: github-actions-gcr@sanity-labs.iam.gserviceaccount.com
        token_format: access_token

    - name: Login to Artifact Registry
      uses: docker/login-action@v3
      with:
        registry: europe-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.wif.outputs.access_token }}
