name: Setup GCP
description: Authenticate to GCP and configure Docker for Artifact Registry

runs:
  using: composite
  steps:
    - name: Detect OIDC token permission
      id: oidc
      shell: bash
      run: echo "available=${ACTIONS_ID_TOKEN_REQUEST_URL:+true}" >> "$GITHUB_OUTPUT"

    - name: Authenticate to GCP
      id: wif
      if: steps.oidc.outputs.available == 'true'
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/670405469856/locations/global/workloadIdentityPools/github-actions/providers/github
        service_account: github-actions-gcr@sanity-labs.iam.gserviceaccount.com
        token_format: access_token

    - name: Authenticate to GCP with GCR_CREDENTIALS
      if: steps.oidc.outputs.available != 'true'
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ env.GCR_CREDENTIALS }}

    - name: Login to Artifact Registry
      uses: docker/login-action@v3
      with:
        registry: europe-docker.pkg.dev
        username: ${{ steps.wif.outputs.access_token != '' && 'oauth2accesstoken' || '_json_key' }}
        password: ${{ steps.wif.outputs.access_token || env.GCR_CREDENTIALS }}
